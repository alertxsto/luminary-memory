name: Stale

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 14
          days-before-pr-stale: 21
          days-before-pr-close: 14
          stale-issue-message: >
            This issue has been inactive for 30 days. If it's still relevant,
            drop a comment to keep it open — otherwise it will be closed in 14 days.
          stale-pr-message: >
            This PR has been inactive for 21 days. If you're still working on it,
            push a new commit or comment to keep it open — otherwise it will be
            closed in 14 days.
          close-issue-message: "Closing due to inactivity. Feel free to reopen if this is still relevant."
          close-pr-message: "Closing due to inactivity. You can reopen this PR when you're ready to continue."
          exempt-issue-labels: "help wanted,good first issue"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          operations-per-run: 100
