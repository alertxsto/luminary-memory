name: Contributor Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-contributor:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze contributor account
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const login = pr.user.login;
            const body = (pr.body || "") + "\n" + (pr.title || "");

            let commitMessages = "";
            try {
              const cm = await github.rest.pulls.listCommits({
                owner, repo, pull_number: pr.number, per_page: 50,
              });
              commitMessages = (cm.data || []).map((c) => c.commit && c.commit.message).join("\n");
            } catch (e) {
              console.log("could not list commits: " + e.message);
            }

            let user;
            try {
              user = await github.rest.users.getByUsername({ username: login });
            } catch (e) {
              console.log("could not fetch user " + login + ": " + e.message);
              return;
            }
            const u = user.data;

            const createdAt = new Date(u.created_at).getTime();
            const ageDays = Math.max(1, Math.round((Date.now() - createdAt) / 86400000));
            const repos = u.public_repos ?? 0;
            const followers = u.followers ?? 0;
            const hasBio = !!(u.bio && u.bio.trim());
            const isBot = u.type !== "User";

            // ---- ACCOUNT SIGNALS (subtle, high-precision only) ----
            let suspicious = false;
            let reason = null;
            if (isBot) { suspicious = true; reason = "non-user account type"; }
            else if (ageDays <= 1 && repos === 0 && followers === 0) { suspicious = true; reason = "brand-new empty account"; }
            else if (/bot|automation/i.test(login) && repos === 0) { suspicious = true; reason = "bot-like handle with no activity"; }

            // ---- AI-SLOP SCAN (high-precision phrases only, no generic words) ----
            const aiPatterns = [
              /\b(delve into|tapestry of|in today's fast-paced world|ever-evolving landscape)\b/i,
              /(i hope this (helps|meets|addresses your)|please let me know if (you have any|there are any) (questions|issues|concerns))/i,
              /(this (PR|pull request) (aims|serves|seeks) to)/i,
              /(feel free to (reach out|comment below)|happy to (address|make) (any|all) (changes|feedback))/i,
              /^#{1,3}\s*(overview|introduction|implementation details)\s*$/mi,
            ];
            const aiHits = aiPatterns.filter((p) => p.test(body) || p.test(commitMessages));
            const aiSuspicious = aiHits.length >= 3;
            let aiNote = null;
            if (aiSuspicious) {
              aiNote = "the PR description has a heavily templated tone; a quick manual check is suggested";
            }

            // ---- VERDICT (neutral, non-accusatory) ----
            let verdict = "ok";
            let confidence = 0.75;
            if (suspicious) {
              verdict = "needs review";
              confidence -= 0.3;
            }
            if (aiSuspicious) {
              verdict = "needs review";
              confidence -= 0.15;
            }
            confidence += (followers >= 5 ? 0.1 : 0) + (repos >= 5 ? 0.1 : 0) + (ageDays > 90 ? 0.1 : 0);
            confidence = Math.max(0.3, Math.min(0.95, confidence));

            const lines = [];
            lines.push("👤 Welcome @**" + login + "**! A maintainer will review this shortly.");
            lines.push("");
            lines.push("> Status: " + verdict + (suspicious ? " — account flagged (" + reason + ")" : "") + (aiNote ? " · " + aiNote : ""));

            const bodyComment = lines.join("\n");
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body: bodyComment,
            });
            console.log("contributor check " + login + ": " + verdict);
