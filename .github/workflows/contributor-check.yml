name: Contributor Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-contributor:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze contributor account
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const login = pr.user.login;
            const body = (pr.body || "") + "\n" + (pr.title || "");
            const commitMessages = (context.payload.pull_request.commits || [])
              .map((c) => c.commit && c.commit.message)
              .join("\n");

            let user;
            try {
              user = await github.rest.users.getByUsername({ username: login });
            } catch (e) {
              console.log("could not fetch user " + login + ": " + e.message);
              return;
            }
            const u = user.data;

            const createdAt = new Date(u.created_at).getTime();
            const ageDays = Math.max(1, Math.round((Date.now() - createdAt) / 86400000));
            const repos = u.public_repos ?? 0;
            const followers = u.followers ?? 0;
            const following = u.following ?? 0;
            const hasBio = !!(u.bio && u.bio.trim());
            const isBot = u.type !== "User";
            const hasEmail = !!u.email;

            // ---- ACCOUNT RED FLAGS ----
            const redFlags = [];
            if (isBot) redFlags.push("account type is not a human User");
            if (ageDays <= 1) redFlags.push("account created less than a day ago");
            if (ageDays <= 7 && followers === 0) redFlags.push("account under a week old with zero followers");
            if (repos === 0 && followers === 0 && !hasBio) redFlags.push("empty account (no repos, no followers, no bio)");
            if (/bot|automation|spam/i.test(login) && repos === 0) redFlags.push("bot-like username with no repos");
            if (!hasEmail) redFlags.push("no verified email on account");

            // ---- GREEN SIGNALS ----
            const greenSignals = [];
            if (repos >= 1) greenSignals.push(repos + " public repos");
            if (followers >= 1) greenSignals.push(followers + " followers");
            if (hasBio) greenSignals.push("has a bio");
            if (ageDays > 30) greenSignals.push("account " + ageDays + " days old");

            // ---- AI SLOP LANGUAGE CHECK (PR body + title + commit messages) ----
            const aiSlopPatterns = [
              // classic AI filler
              /\b(delve|tapestry|landscape|testament|underscore|leverage)\b/i,
              /\b(crucial|paramount|pivotal|seamless|seamlessly|robust|comprehensive)\b/i,
              /\b(in today's|ever-evolving|rapidly evolving|fast-paced) (world|landscape)\b/i,
              // generic PR boilerplate that AI writes
              /(i hope this (helps|meets|addresses)|please let me know if (you have|there are)|feel free to (review|reach out|comment))/i,
              /(this PR|this pull request) (aims to|is designed to|serves to|seeks to)/i,
              /(adds?|implements?|enhances?) (robust|comprehensive|seamless) (support|handling|functionality)/i,
              /(ensures|guarantees) (the|that|smooth|seamless)/i,
              // AI closing lines
              /(thank you for (your )?(time|consideration|review))/i,
              /(happy to (make|address|adjust) (any|all) (changes|feedback))/i,
              // em-dash overuse (AI loves em-dashes)
              /(\u2014.*\u2014.*\u2014)/,
              // numbered AI-style list filler
              /(1\.\s*\*\*|2\.\s*\*\*|overview\s*\n|implementation details\s*\n)/i,
            ];
            const aiHits = aiSlopPatterns.filter((p) => p.test(body) || p.test(commitMessages));
            const aiScore = aiHits.length;

            // ---- COMMIT PATTERN CHECK ----
            const commitLines = commitMessages.split("\n").filter(Boolean);
            const allSameStyle = commitLines.length >= 2 && commitLines.every((c) =>
              /^(feat|fix|chore|docs|test|refactor|perf|ci|build|style|revert)[:(]/.test(c)
            );
            const templateCommits = /generated by (copilot|claude|gpt|codex|ai)|🤖|\[bot\]|created by ai/i.test(commitMessages);

            if (allSameStyle && commitLines.length >= 3) redFlags.push("commit messages follow a rigid conventional-commit template (AI pattern)");
            if (templateCommits) redFlags.push("commit messages contain AI-generation markers");
            if (aiScore >= 4) redFlags.push("PR language matches " + aiScore + " AI-slop patterns");
            else if (aiScore >= 2) redFlags.push("PR language has " + aiScore + " AI-slop pattern(s)");

            // ---- VERDICT ----
            let verdict = "human-like";
            let confidence = 0.7;
            confidence += redFlags.length === 0 ? 0.2 : 0;
            confidence -= redFlags.length * 0.3;
            confidence += (followers >= 5 ? 0.1 : 0) + (repos >= 5 ? 0.1 : 0);
            confidence = Math.max(0.1, Math.min(0.98, confidence));
            if (redFlags.length >= 2) verdict = "suspicious";
            else if (redFlags.length === 1) verdict = "possible automation";

            const flagLine = redFlags.length
              ? redFlags.map((f) => "- ⚠️ " + f).join("\n")
              : "- ✅ no red flags";
            const greenLine = greenSignals.length
              ? greenSignals.map((g) => "- ✅ " + g).join("\n")
              : "- (no green signals)";

            const aiDetail = aiScore === 0
              ? "no AI-slop patterns detected in PR language"
              : "matched " + aiScore + " AI-slop pattern(s): " + aiHits.map(String).join("; ").slice(0, 200);

            const lines = [];
            lines.push("## 👤 Contributor Account Check — @" + login);
            lines.push("");
            lines.push("**Verdict:** " + verdict + " · **Confidence:** " + Math.round(confidence * 100) + "%");
            lines.push("");
            lines.push("| Signal | Value |");
            lines.push("|---|---|");
            lines.push("| Account created | " + new Date(u.created_at).toISOString().slice(0, 10) + " (" + ageDays + " days ago) |");
            lines.push("| Public repos | " + repos + " |");
            lines.push("| Followers / following | " + followers + " / " + following + " |");
            lines.push("| Bio | " + (hasBio ? "yes" : "no") + " |");
            lines.push("| Verified email | " + (hasEmail ? "yes" : "no") + " |");
            lines.push("| Account type | " + u.type + " |");
            lines.push("");
            lines.push("**AI-slop language scan:** " + aiDetail);
            lines.push("");
            lines.push("**Red flags:**");
            lines.push(flagLine);
            lines.push("");
            lines.push("**Green signals:**");
            lines.push(greenLine);
            lines.push("");
            lines.push("> This is an automated triage hint based on public account metadata and PR language. It is **not** a judgment on the contribution's quality or the contributor's legitimacy — always review the code and the conversation.");

            const bodyComment = lines.join("\n");
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body: bodyComment,
            });
            console.log("posted contributor check for " + login + ": " + verdict + " (" + Math.round(confidence * 100) + "%)");
