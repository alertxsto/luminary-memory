name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-packages:
    name: Build release plugin tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check Python, plugin and tag versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: PYTHON=python bash scripts/bump-version.sh --check
      - name: Install the actual Python bridge
        run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:opencode
      - run: npm run test:ui-contracts
      - run: LUMINARY_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')" npm run test:plugins
      - run: npm run pack:plugins
      - name: Check complete, version-matched release tarballs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tarfile
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = {f"luminary-memory-{agent}-{version}.tgz" for agent in ("pi", "opencode", "omp")}
          directory = Path("artifacts/plugins")
          actual = {path.name for path in directory.glob("*.tgz")}
          if actual != expected:
              raise SystemExit(f"Expected tarballs {sorted(expected)}, got {sorted(actual)}")
          for filename in sorted(expected):
              with tarfile.open(directory / filename, "r:gz") as archive:
                  manifest = json.load(archive.extractfile("package/package.json"))
                  if filename != f'{manifest["name"]}-{manifest["version"]}.tgz' or manifest["version"] != version:
                      raise SystemExit(f"{filename}: packed manifest name/version mismatch")
                  for member in ("package/dist/index.js", "package/README.md", "package/LICENSE"):
                      entry = archive.getmember(member)
                      if not entry.isfile() or entry.size == 0:
                          raise SystemExit(f"{filename}: missing or empty {member}")
          PY
      - name: Build the setup consumer wheel
        run: python -m build --wheel --outdir artifacts/setup-wheel
      - uses: actions/upload-artifact@v4
        with:
          name: setup-wheel
          path: artifacts/setup-wheel/*.whl
          if-no-files-found: error
      - name: Upload validated plugin tarballs
        uses: actions/upload-artifact@v4
        with:
          name: native-plugin-packages
          path: artifacts/plugins/*.tgz
          if-no-files-found: error
      - name: Upload complete wheel resources
        uses: actions/upload-artifact@v4
        with:
          name: inspector-resources
          path: |
            src/luminary_memory/integrations/assets/compiled/
            src/luminary_memory/inspector/assets/browser/
          if-no-files-found: error

  python-native-contracts:
    name: Test Python against the official Hermes SDK
    needs: [native-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: v0.22.5
          path: .native-sdk/hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and native HTTP dependencies
        # Hermes 0.22.5 imports hermes_yaml, which requires ruamel.yaml.
        run: python -m pip install -e ".[dev]" fastapi httpx python-multipart "ruamel.yaml==0.18.16"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
      - name: Install the consumer-test build toolchain
        run: npm ci --ignore-scripts
      - name: Download validated native and UI resources
        uses: actions/download-artifact@v4
        with:
          name: inspector-resources
          path: src/luminary_memory
      - name: Build and install a separate inspector consumer wheel
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/inspector-wheel"
          python -m venv "$RUNNER_TEMP/inspector-wheel-env"
          "$RUNNER_TEMP/inspector-wheel-env/bin/python" -m pip install "$RUNNER_TEMP/inspector-wheel/"*.whl
      - name: Require the real SDK and run the Python suite
        env:
          INSPECTOR_INSTALLED_PYTHON: ${{ runner.temp }}/inspector-wheel-env/bin/python
        run: python scripts/test-hermes-sdk.py .native-sdk/hermes-agent -q

  real-model:
    # Release gate. Runs public strict recall against the real default
    # embedding model on an isolated SQLite store and asserts which facts come
    # back: the current scoped fact must be retrieved, an off-topic but
    # graph-linked row must not be, cross-scope and expired rows stay out, and
    # unanswerable queries abstain. This fails closed: if the model cannot be
    # downloaded or run, the release does not happen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with the real embedding engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Gate on public strict recall with the default model
        run: python scripts/smoke-real-model.py --report real-model-gate.json
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-gate
          path: real-model-gate.json
          if-no-files-found: ignore

  setup-contracts:
    name: Installed setup contracts (${{ matrix.os }})
    needs: [native-packages]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: setup-wheel
          path: artifacts/setup-wheel
      - uses: actions/download-artifact@v4
        with:
          name: native-plugin-packages
          path: artifacts/plugins
      - run: python -m pip install artifacts/setup-wheel/*.whl pytest
      - run: npm ci --ignore-scripts
      - name: Exercise the installed setup and actual platform shell
        run: |
          python -I -c "from luminary_memory.integrations.setup import run_setup"
          python -m pytest tests/test_setup_bootstrap.py tests/test_setup.py tests/test_agent_integrations.py tests/test_embeddings.py tests/test_release_versions.py tests/hermes/test_install_script.py -q
          node scripts/test-installed-inspector.mjs "$(python -c 'import sys; print(sys.executable)')"
          LUMINARY_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')" npm run test:plugin-artifacts
          python scripts/smoke-setup-bootstrap.py artifacts/setup-wheel/*.whl

  pypi:
    needs: [real-model, native-packages, python-native-contracts, setup-contracts]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/luminary-memory
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Download validated native and UI resources
        uses: actions/download-artifact@v4
        with:
          name: inspector-resources
          path: src/luminary_memory
      - name: Download the exact tested wheel
        uses: actions/download-artifact@v4
        with:
          name: setup-wheel
          path: dist
      - name: Build sdist without replacing the tested wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist
      - name: Download validated plugin tarballs
        uses: actions/download-artifact@v4
        with:
          name: native-plugin-packages
          path: artifacts/plugins
      - name: Build Hermes skill artifact
        run: |
          mkdir -p skill_asset
          zip -j skill_asset/luminary-memory-skill.zip hermes/SKILL.md hermes/README.md
          ls -lh skill_asset/luminary-memory-skill.zip
      - name: Publish to PyPI (trusted publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publisher only — no API token. Configured at
        # https://pypi.org/manage/account/publishing/. Never fall back to twine:
        # an API token upload alongside Trusted Publishing triggers a PyPI alert.
      - name: Attach skill and native plugin assets to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            skill_asset/luminary-memory-skill.zip
            artifacts/plugins/*.tgz
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: Publish configured npm plugins
    needs: [pypi, native-packages]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_NPM_PLUGINS == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
      - name: Install an npm CLI with trusted publishing support
        run: npm install --global 'npm@^11.5.1' --ignore-scripts
      - name: Download the exact validated release tarballs
        uses: actions/download-artifact@v4
        with:
          name: native-plugin-packages
          path: artifacts/plugins
      - name: Publish built tarballs using npm trusted publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for agent in pi opencode omp; do
            archive="artifacts/plugins/luminary-memory-${agent}-${version}.tgz"
            test -s "$archive"
          done
          for agent in pi opencode omp; do
            archive="artifacts/plugins/luminary-memory-${agent}-${version}.tgz"
            npm publish "$archive" --access public --ignore-scripts --registry https://registry.npmjs.org
          done
