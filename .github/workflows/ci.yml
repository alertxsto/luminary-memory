name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests hermes/hooks
      - name: Test and coverage
        run: |
          python -m coverage run --source=src/luminary_memory -m pytest -q
          python -m coverage report --fail-under=82

  native-packages:
    name: Native plugin packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the actual Python bridge
        run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:plugins
      - run: npm run test:plugins
      - run: npm run pack:plugins
      - name: Upload installable plugin tarballs
        uses: actions/upload-artifact@v4
        with:
          name: native-plugin-packages
          path: artifacts/plugins/*.tgz
          if-no-files-found: error

  pgvector-integration:
    name: PostgreSQL pgvector integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: luminary
          POSTGRES_PASSWORD: luminary
          POSTGRES_DB: luminary
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests hermes/hooks
      - name: Run pgvector integration tests
        env:
          LUMINARY_PG_DSN: postgresql://luminary:luminary@localhost:5432/luminary
        run: >-
          python -m coverage run --source=src/luminary_memory/backends
          -m pytest -q tests/test_backend_pgvector.py
          && python -m coverage report -m
          src/luminary_memory/backends/pgvector.py
