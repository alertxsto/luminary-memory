[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luminary-memory"
version = "0.1.0"
description = "A lightweight, self-hosted memory layer for AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Dwiky Candra" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastembed>=0.4.0",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
]

[project.urls]
Homepage = "https://github.com/alertxsto/luminary-memory"
Repository = "https://github.com/alertxsto/luminary-memory"
Documentation = "https://github.com/alertxsto/luminary-memory#readme"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
luminary-memory = "luminary_memory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/luminary_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
